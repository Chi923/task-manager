<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能任务管理系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen py-8 px-4">
  <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-md p-6">
    <h1 class="text-2xl font-bold text-center text-slate-800 mb-6">📋 智能任务管理系统</h1>

    <div class="flex gap-3 mb-6">
      <input
        id="taskInput"
        type="text"
        placeholder="输入新任务..."
        class="flex-1 border border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
      >
      <select id="prioritySelect" class="border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
        <option value="高">高</option>
        <option value="中" selected>中</option>
        <option value="低">低</option>
      </select>
      <button id="addBtn" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg transition">添加</button>
    </div>

    <div class="flex gap-2 mb-5">
      <button data-filter="全部" class="filter-btn bg-slate-200 px-3 py-1 rounded-md hover:bg-slate-300 transition">全部</button>
      <button data-filter="高" class="filter-btn bg-slate-200 px-3 py-1 rounded-md hover:bg-slate-300 transition">高优先级</button>
      <button data-filter="中" class="filter-btn bg-slate-200 px-3 py-1 rounded-md hover:bg-slate-300 transition">中优先级</button>
      <button data-filter="低" class="filter-btn bg-slate-200 px-3 py-1 rounded-md hover:bg-slate-300 transition">低优先级</button>
    </div>

    <div id="taskList" class="space-y-3"></div>
  </div>

  <script>
    let currentFilter = "全部";
    const taskInput = document.getElementById('taskInput');
    const prioritySelect = document.getElementById('prioritySelect');
    const addBtn = document.getElementById('addBtn');
    const taskList = document.getElementById('taskList');
    const filterBtns = document.querySelectorAll('.filter-btn');

    loadTasks();

    // 添加任务
    addBtn.addEventListener('click', async () => {
      const title = taskInput.value.trim();
      if (!title) return alert("任务内容不能为空");
      const priority = prioritySelect.value;
      const res = await fetch('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, priority })
      });
      const result = await res.json();
      if (!res.ok) {
        alert("添加失败：" + result.error);
        return;
      }
      taskInput.value = "";
      loadTasks();
    })

    taskInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') addBtn.click();
    })

    // 筛选切换
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        currentFilter = btn.dataset.filter;
        filterBtns.forEach(b => b.classList.remove('bg-blue-400','text-white'));
        btn.classList.add('bg-blue-400','text-white');
        loadTasks();
      })
    })

    // 加载任务
    async function loadTasks() {
      const res = await fetch(`/api/tasks?filter=${encodeURIComponent(currentFilter)}`);
      const tasks = await res.json();
      if (!res.ok) {
        taskList.innerHTML = '<p class="text-red-500">加载任务失败</p>';
        return;
      }
      renderTasks(tasks);
    }

    function renderTasks(tasks) {
      if (tasks.length === 0) {
        taskList.innerHTML = '<p class="text-slate-400 text-center py-4">暂无任务</p>';
        return;
      }
      taskList.innerHTML = "";
      tasks.forEach(task => {
        const div = document.createElement('div');
        let priorityColor = 'bg-green-100 text-green-700';
        if(task.priority === '高') priorityColor = 'bg-red-100 text-red-700';
        if(task.priority === '中') priorityColor = 'bg-amber-100 text-amber-700';
        div.className = `flex items-center justify-between p-4 border rounded-lg ${task.completed ? 'bg-slate-50' : 'bg-white'}`;
        div.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="px-2 py-0.5 rounded text-sm ${priorityColor}">${task.priority}</span>
            <span class="${task.completed ? 'line-through text-slate-400' : 'text-slate-800'}">${escapeHtml(task.title)}</span>
          </div>
          <div class="flex gap-2">
            <button class="toggle-btn px-3 py-1 rounded text-sm ${task.completed ? 'bg-orange-400' : 'bg-emerald-500'} text-white" data-id="${task.id}">
              ${task.completed ? '未完成' : '完成'}
            </button>
            <button class="del-btn px-3 py-1 rounded text-sm bg-red-500 text-white" data-id="${task.id}">删除</button>
          </div>
        `
        taskList.appendChild(div);
      })

      // 切换完成
      document.querySelectorAll('.toggle-btn').forEach(btn => {
        btn.onclick = async () => {
          const id = btn.dataset.id;
          const targetTask = await fetch(`/api/tasks?filter=全部`).then(r=>r.json()).then(list=>list.find(i=>i.id == id));
          await fetch(`/api/tasks/${id}`, {
            method: 'PATCH',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ completed: !targetTask.completed })
          })
          loadTasks();
        }
      })
      // 删除
      document.querySelectorAll('.del-btn').forEach(btn => {
        btn.onclick = async () => {
          if(!confirm("确定删除这条任务？")) return;
          const id = btn.dataset.id;
          await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
          loadTasks();
        }
      })
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))
    }
  </script>
</body>
</html>
