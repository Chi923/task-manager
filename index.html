<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待办事项管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #f5f7fa;
            padding: 40px 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 28px;
            color: #1f2937;
            text-align: center;
            margin-bottom: 24px;
        }
        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .input-area input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 16px;
        }
        .input-area button {
            padding: 10px 20px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        .todo-list {
            list-style: none;
        }
        .todo-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
            font-size: 16px;
            color: #374151;
        }
        .todo-item.completed {
            color: #9ca3af;
            text-decoration: line-through;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>我的待办事项</h1>
        <div class="input-area">
            <input type="text" id="todoInput" placeholder="请输入要添加的待办事项">
            <button id="addBtn">添加任务</button>
        </div>
        <ul class="todo-list" id="todoList">
            <li class="todo-item">示例任务1：完成课程作业</li>
            <li class="todo-item completed">示例任务2：阅读教材章节</li>
            <li class="todo-item">示例任务3：提交实训报告</li>
        </ul>
    </div>

    <script>
        // 纯前端本地演示JS，不会清空静态文字
        const input = document.getElementById('todoInput');
        const addBtn = document.getElementById('addBtn');
        const list = document.getElementById('todoList');

        addBtn.addEventListener('click', () => {
            const text = input.value.trim();
            if (!text) return;
            const li = document.createElement('li');
            li.className = 'todo-item';
            li.textContent = text;
            list.appendChild(li);
            input.value = '';
        });
    </script>
</body>
</html>
