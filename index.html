<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能任务管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #f4f7fa;
            padding: 40px 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 28px;
            font-size: 26px;
        }
        .add-area {
            display: flex;
            gap:10px;
            margin-bottom:20px;
        }
        #taskInput {
            flex:1;
            padding:12px 14px;
            border:1px solid #ddd;
            border-radius:8px;
            font-size:16px;
        }
        #prioritySelect {
            padding:12px 10px;
            border:1px solid #ddd;
            border-radius:8px;
            font-size:16px;
            min-width:90px;
        }
        #addBtn {
            padding:12px 20px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
        }
        .filter-area {
            display:flex;
            gap:8px;
            margin-bottom:24px;
            flex-wrap:wrap;
        }
        .filter-btn {
            padding:8px 14px;
            border:1px solid #cbd5e1;
            border-radius:6px;
            background:#fff;
            cursor:pointer;
        }
        .filter-btn.active {
            background:#2563eb;
            color:#fff;
            border-color:#2563eb;
        }
        .task-item {
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:14px 16px;
            border:1px solid #e5e7eb;
            border-radius:10px;
            margin-bottom:12px;
        }
        .task-left {
            display:flex;
            align-items:center;
            gap:12px;
        }
        .task-title {
            font-size:16px;
        }
        .task-title.done {
            text-decoration: line-through;
            color:#94a3b8;
        }
        .tag {
            padding:3px 8px;
            border-radius:4px;
            font-size:13px;
            color:#fff;
        }
        .tag-high {
            background:#ef4444;
        }
        .tag-mid {
            background:#f59e0b;
        }
        .tag-low {
            background:#10b981;
        }
        .task-right {
            display:flex;
            gap:8px;
        }
        .toggle-btn {
            padding:7px 12px;
            border:none;
            border-radius:6px;
            background:#64748b;
            color:white;
            cursor:pointer;
        }
        .del-btn {
            padding:7px 12px;
            border:none;
            border-radius:6px;
            background:#dc2626;
            color:white;
            cursor:pointer;
        }
        .empty-tip {
            text-align:center;
            color:#94a3b8;
            padding:20px;
        }
    </style>
</head>
<body>
    <h1>123</h1>
     <h2>测试文字</h2>

    <div class="container">
        <h1>智能任务管理系统</h1>
        <div class="add-area">
            <input type="text" id="taskInput" placeholder="请输入任务内容">
            <select id="prioritySelect">
                <option value="高">高</option>
                <option value="中" selected>中</option>
                <option value="低">低</option>
            </select>
            <button id="addBtn">添加任务</button>
        </div>
        <div class="filter-area">
            <button class="filter-btn active" data-filter="全部">全部</button>
            <button class="filter-btn" data-filter="高">高优先级</button>
            <button class="filter-btn" data-filter="中">中优先级</button>
            <button class="filter-btn" data-filter="低">低优先级</button>
        </div>
        <div id="taskList"></div>
    </div>

    <script>
        let currentFilter = "全部";
        const taskList = document.getElementById("taskList");
        const taskInput = document.getElementById("taskInput");
        const prioritySelect = document.getElementById("prioritySelect");
        const addBtn = document.getElementById("addBtn");
        const filterBtns = document.querySelectorAll(".filter-btn");

        // 防抖，解决429限流
        let renderTimer = null;
        function debounceRender() {
            clearTimeout(renderTimer);
            renderTimer = setTimeout(renderTasks, 150);
        }

        async function renderTasks() {
            const res = await fetch(`/api/tasks?filter=${currentFilter}`);
            const tasks = await res.json();
            taskList.innerHTML = "";
            if (tasks.length === 0) {
                taskList.innerHTML = `<div class="empty-tip">暂无任务</div>`;
                return;
            }
            tasks.forEach(task => {
                const div = document.createElement("div");
                div.className = "task-item";
                div.innerHTML = `
                    <div class="task-left">
                        <span class="task-title ${task.completed ? 'done' : ''}">${task.title}</span>
                        <span class="tag tag-${task.priority === '高' ? 'high' : task.priority === '中' ? 'mid' : 'low'}">${task.priority}</span>
                    </div>
                    <div class="task-right">
                        <button class="toggle-btn" data-id="${task.id}" data-completed="${task.completed}">
                            ${task.completed ? "标记未完成" : "标记完成"}
                        </button>
                        <button class="del-btn" data-id="${task.id}">删除</button>
                    </div>
                `;
                taskList.appendChild(div);
            })
            bindEvent();
        }

        function bindEvent() {
            document.querySelectorAll(".toggle-btn").forEach(btn=>{
                btn.onclick = async ()=>{
                    const id = btn.dataset.id;
                    const completed = btn.dataset.completed === "true";
                    await fetch(`/api/tasks/${id}`, {
                        method:"PATCH",
                        headers:{"Content-Type":"application/json"},
                        body:JSON.stringify({completed: !completed})
                    })
                    debounceRender();
                }
            })
            document.querySelectorAll(".del-btn").forEach(btn=>{
                btn.onclick = async ()=>{
                    const id = btn.dataset.id;
                    await fetch(`/api/tasks/${id}`, {method:"DELETE"});
                    debounceRender();
                }
            })
        }

        addBtn.onclick = async ()=>{
            const title = taskInput.value.trim();
            const priority = prioritySelect.value;
            if(!title) return alert("请输入任务内容");
            await fetch("/api/tasks", {
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify({title,priority})
            })
            taskInput.value = "";
            debounceRender();
        }
        taskInput.onkeydown = (e)=>{
            if(e.key === "Enter") addBtn.click();
        }

        filterBtns.forEach(btn=>{
            btn.onclick = ()=>{
                filterBtns.forEach(b=>b.classList.remove("active"));
                btn.classList.add("active");
                currentFilter = btn.dataset.filter;
                debounceRender();
            }
        })

        renderTasks();
    </script>
</body>
</html>
